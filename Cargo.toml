[package]
name = "wavelane"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Drag each application's sound onto any output: a sound map over the screen."

[dependencies]
gpui-kit = "=0.8.0"
anyhow = "1"
serde_json = "1"
# Updates: release feed, SHA-256 checks (as LinX).
semver = "=1.0.28"
sha2 = "=0.10.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-native-roots"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The Linux platform gpui-kit runs on; the direct dependency reaches the
# vendored patch API (crate name gpui_linux): window raise, blur.
gpui-pre-linux = "=0.3.9"
wavelane-fast-linux = { package = "gpui-fast-linux", version = "=0.1.10", optional = true }
# System-wide shortcut (Global Shortcuts portal).
ashpd = { version = "=0.13.13", default-features = false, features = ["global_shortcuts", "async-io"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
futures-util = "0.3"
# Tray icon (StatusNotifierItem), drawn from the app's SVG.
ksni = { version = "=0.3.6", features = ["blocking"] }
resvg = { version = "=0.45.1", default-features = false }

[features]
# Development builds suggest Ctrl+Alt+W for the map, leaving Ctrl+Alt+M to
# LinX on the same desktop. Releases suggest Ctrl+Alt+M.
dev-shortcut = []
# Isolated synthetic scenes and frame profiling; never touches PipeWire.
perf-harness = ["dev-shortcut", "gpui-kit/profiler"]
# Experimental only; the default remains gpui-pre.
gpui-fast = ["gpui-kit/gpui-fast", "dep:wavelane-fast-linux"]

[workspace]

[profile.dev]
debug = 1

# Vendored crates patched for Wavelane: see vendor/README.md.
[patch.crates-io]
ksni = { path = "vendor/ksni" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-component = { path = "vendor/gpui-component" }

gpui-fast-linux = { path = "vendor/gpui-fast-linux" }
